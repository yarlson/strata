name: Bug report
description: Report broken or unexpected behavior in Strata
title: ""
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Strata. Please search existing issues before submitting a new report.

  - type: input
    id: version
    attributes:
      label: Strata version
      description: Find this under Strata → About Strata, or provide the commit SHA you built.
      placeholder: e.g. 1.0.0 or commit abc1234
    validations:
      required: true

  - type: dropdown
    id: installation
    attributes:
      label: Installation method
      options:
        - Built from source
        - Copied from another Mac
        - Other
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: macOS version and Mac
      placeholder: e.g. macOS 26.1, MacBook Air (Apple silicon)
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Briefly describe the problem and its impact.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable sequence that triggers the problem.
      placeholder: |
        1. Open …
        2. Select …
        3. Observe …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect Strata to do?
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or video
      description: Drag in screenshots or a short recording if they help demonstrate the problem.

  - type: markdown
    attributes:
      value: |
        ### Crash logs

        If Strata crashed, open **Console**, choose **Crash Reports**, and select the latest `Strata` report. Messages from a run are available with:

        ```shell
        log show --last 30m --predicate 'process == "Strata"'
        ```

        Paste relevant text below after removing private paths, filenames, hostnames, and secrets. Do not attach memory dumps: they can contain passwords, tokens, and private document contents.

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste crash details, backtraces, or terminal output here. Leave this empty if no logs are available.
      render: shell

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Include anything else that may help, such as whether the issue is intermittent or a recent regression.
