min_version = "2026.9.0"

[tools]
"aqua:crate-ci/typos" = "1.50.1"

[tasks.build]
description = "Build the release Strata.app into target/macos"
run = "./macos/scripts/build-app.sh"

[tasks.dev]
description = "Build a debug Strata.app and open it"
run = "./macos/scripts/build-app.sh --debug && open target/macos/Strata.app"

[tasks.test]
description = "Run the Swift tests"
run = "swift test --package-path macos"

[tasks.lint]
description = "Check Swift formatting"
run = "swift format lint --strict --recursive macos/Package.swift macos/Sources macos/Tests macos/scripts"

[tasks.typos]
description = "Check spelling"
run = "typos"

[tasks.check]
description = "Local pre-push checks"
depends = ["lint", "test", "typos"]
